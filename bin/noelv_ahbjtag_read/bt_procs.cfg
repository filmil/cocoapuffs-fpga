# Frame-pointer backtrace over the ahbjtag DM.  Sv39 translate (satp root
# fixed at 0x827000 for this boot) + read stack, walk fp chain.
# RISC-V clang frame record: [fp-8]=ra, [fp-16]=caller fp.
proc rdp {phys} {
    # read one 32-bit word at a PHYSICAL address
    return [expr {"[ahb_read $phys]" & 0xffffffff}]
}
proc rd64p {phys} {
    set lo [rdp $phys]
    set hi [rdp [expr {$phys + 4}]]
    return [expr {($hi << 32) | $lo}]
}
proc v2p {va} {
    set root 0x827000
    set idx2 [expr {($va >> 30) & 0x1ff}]
    set p2 [rd64p [expr {$root + $idx2*8}]]
    if {($p2 & 1) == 0} { return 0 }
    set t1 [expr {($p2 >> 10) << 12}]
    set idx1 [expr {($va >> 21) & 0x1ff}]
    set p1 [rd64p [expr {$t1 + $idx1*8}]]
    if {($p1 & 1) == 0} { return 0 }
    if {($p1 & 0xe) != 0} { return [expr {(($p1 >> 10) << 12) | ($va & 0x1fffff)}] }
    set t0 [expr {($p1 >> 10) << 12}]
    set idx0 [expr {($va >> 12) & 0x1ff}]
    set p0 [rd64p [expr {$t0 + $idx0*8}]]
    if {($p0 & 1) == 0} { return 0 }
    return [expr {(($p0 >> 10) << 12) | ($va & 0xfff)}]
}
proc rd64v {va} {
    set phys [v2p $va]
    if {$phys == 0} { return 0 }
    return [rd64p $phys]
}
proc bt {} {
    dm_activate
    dm_halt
    dm_wreg 0x7c1 0x1cf
    set fp [expr {"[dm_reg 0x1008]" & 0xffffffffffffffff}]
    set pc [expr {"[dm_pc]" & 0xffffffffffffffff}]
    echo [format "#pc  0x%016x" $pc]
    for {set i 0} {$i < 24} {incr i} {
        if {$fp == 0 || $fp < 0x1000} break
        set ra [rd64v [expr {$fp - 8}]]
        set nf [rd64v [expr {$fp - 16}]]
        echo [format "#%-2d ra=0x%016x fp=0x%016x" $i $ra $fp]
        set fp $nf
    }
    dm_resume
}

proc btd {} {
    dm_activate
    dm_halt
    dm_wreg 0x7c1 0x1cf
    set fp [expr {"[dm_reg 0x1008]" & 0xffffffffffffffff}]
    echo [format "fp=0x%016x" $fp]
    set p [v2p [expr {$fp - 8}]]
    echo [format "phys(fp-8)=0x%x" $p]
    set ra [rd64v [expr {$fp - 8}]]
    echo [format "ra=0x%016x" $ra]
    set nf [rd64v [expr {$fp - 16}]]
    echo [format "nextfp=0x%016x" $nf]
    dm_resume
}

proc bt2 {} {
    dm_activate
    dm_halt
    dm_wreg 0x7c1 0x1cf
    set pc [expr {"[dm_pc]" & 0xffffffffffffffff}]
    echo [format "#pc  0x%016x" $pc]
    set fp [expr {"[dm_reg 0x1008]" & 0xffffffffffffffff}]
    for {set i 0} {$i < 30} {incr i} {
        if {[v2p [expr {$fp - 8}]] == 0} break
        set ra [rd64v [expr {$fp - 8}]]
        set nf [rd64v [expr {$fp - 16}]]
        echo [format "#%-2d ra=0x%016x fp=0x%016x" $i $ra $fp]
        if {$nf == 0} break
        set fp $nf
    }
    dm_resume
}
