# openocd reader for the NOEL-V AHB bus via the GRLIB ahbjtag (BSCANE2 + jtagcom2).
# Bypasses GRMON entirely (the eval refuses the non-GPL NOEL-V).
#
# ahbjtag (jtagcom2, versel=1) protocol, derived from grlib jtagcom2.vhd:
#   USER1 (IR 0x02) = address/command reg, 35 bits: {write[34], hsize[33:32], addr[31:0]}
#   USER2 (IR 0x03) = data reg, 33 bits:            {seq[32],   data[31:0]}
# A read: load USER1 with {0, 2(word), addr}; the ahbjtag runs the AHB read; then
# shift USER2 out to capture data[31:0].

# Digilent HS2-flashed FT232H; match by serial (iProduct is "Digilent USB Device",
# not the "...Adept..." the stock digilent-hs2.cfg filters on).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi serial 210251130202
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
adapter speed 1000
source [find cpld/xilinx-xc7.cfg]

init
scan_chain

# 32-bit AHB word read. Returns 0x-prefixed hex.
proc ahb_read {addr} {
    set areg [format 0x%x [expr {(2 << 32) | ($addr & 0xffffffff)}]]
    irscan xc7.tap 0x02
    drscan xc7.tap 35 $areg
    runtest 40
    irscan xc7.tap 0x03
    set d [drscan xc7.tap 33 0]
    return [format 0x%08x [expr {"0x$d" & 0xffffffff}]]
}

# Dump n words starting at addr.
proc ahb_dump {addr n} {
    for {set i 0} {$i < $n} {incr i} {
        set a [expr {$addr + $i*4}]
        echo [format "  0x%08x: %s" $a [ahb_read $a]]
    }
}

# 32-bit AHB word WRITE (size: 2=word, 1=halfword, 0=byte).
proc ahb_write {addr data {size 2}} {
    set areg [format 0x%x [expr {(1 << 34) | ($size << 32) | ($addr & 0xffffffff)}]]
    irscan xc7.tap 0x02
    drscan xc7.tap 35 $areg
    irscan xc7.tap 0x03
    drscan xc7.tap 33 [format 0x%x [expr {$data & 0xffffffff}]]
    runtest 40
}

# --- RISC-V Debug Module (dmnv @ 0xFE000000) over the ahbjtag ---
# DMI registers are memory-mapped at base + (regno<<2):
#   data0=0x10 data1=0x14 dmcontrol=0x40 dmstatus=0x44 abstractcs=0x58 command=0x5c
# Needs the bitstream built with dsuen=1 (otherwise the hart ignores haltreq).
proc dm_activate {} { ahb_write 0xFE000040 0x00000001 }
proc dm_status   {} { return [ahb_read 0xFE000044] }
proc dm_halt {} {
    ahb_write 0xFE000040 0x80000001
    for {set i 0} {$i < 30} {incr i} {
        if {[expr {[ahb_read 0xFE000044] & 0x200}] != 0} break
    }
    ahb_write 0xFE000040 0x00000001
    return [ahb_read 0xFE000044]
}
proc dm_resume {} { ahb_write 0xFE000040 0x40000001; ahb_write 0xFE000040 0x00000001 }
# Read a CSR/GPR via abstract access-register (64-bit). regno: CSR=csr#, GPR=0x1000+n.
proc dm_reg {regno} {
    ahb_write 0xFE00005C [format 0x%x [expr {(3<<20)|(1<<17)|($regno & 0xffff)}]]
    # Wait for the abstract command to complete (abstractcs.busy, bit 12);
    # without this, back-to-back dm_reg calls read STALE data0/1 from the
    # previous command.  Also surface cmderr (bits 10:8).
    for {set i 0} {$i < 100} {incr i} {
        set acs [ahb_read 0xFE000058]
        if {[expr {$acs & 0x1000}] == 0} break
    }
    if {[expr {$acs & 0x700}] != 0} {
        echo "dm_reg: cmderr=[format 0x%x [expr {($acs >> 8) & 7}]] for regno=[format 0x%x $regno]"
        ahb_write 0xFE000058 0x700
    }
    set lo [string range [ahb_read 0xFE000010] 2 end]
    set hi [string range [ahb_read 0xFE000014] 2 end]
    return "0x$hi$lo"
}
proc dm_pc {} { return [dm_reg 0x7b1] }   ;# dpc = PC at halt
# Write a CSR/GPR (64-bit) via abstract access-register.
proc dm_wreg {regno val} {
    ahb_write 0xFE000010 [format 0x%x [expr {$val & 0xffffffff}]]
    ahb_write 0xFE000014 [format 0x%x [expr {($val >> 32) & 0xffffffff}]]
    ahb_write 0xFE00005C [format 0x%x [expr {(3<<20)|(1<<17)|(1<<16)|($regno & 0xffff)}]]
}
# Single-step one instruction: set dpc, set dcsr.step, resume (re-halts after 1).
# Returns the new dpc. Use to test a specific instruction in isolation.
proc dm_step {pc} {
    dm_wreg 0x7b1 $pc                              ;# dpc = pc
    set dcsr [expr {"[dm_reg 0x7b0]" | 0x4}]       ;# dcsr.step = 1
    dm_wreg 0x7b0 $dcsr
    ahb_write 0xFE000040 0x40000001                ;# resumereq
    ahb_write 0xFE000040 0x00000001
    for {set i 0} {$i < 20} {incr i} {
        if {[expr {[ahb_read 0xFE000044] & 0x300}] != 0} break
    }
    return [dm_pc]
}

# Probe commands are passed on the openocd command line via -c, ending in `shutdown`.
